services:
  cloudflare-warp-unlock:
    container_name: cloudflare-warp-unlock
    image: local/cloudflare-warp-unlock:2.0
    build:
      context: .
      args:
        GOST_VERSION: "${GOST_VERSION:-3.3.3}"
        # 1 = UPX 压缩 warp-svc（默认，镜像 ~90MB，含 gost v3）；守护进程异常时改 0 回退
        UPX_WARP_SVC: "${UPX_WARP_SVC:-1}"
    restart: unless-stopped
    init: true

    # 官方客户端 MASQUE 架构：无需 /dev/net/tun、无需 privileged。
    # 新版 warp-svc 连接建立后会安装 fwmark 策略路由规则（ip rule），
    # 需要 NET_ADMIN capability（仅此一项，无需 TUN 设备）。
    cap_add:
      - NET_ADMIN

    # 如需公网暴露，请务必先配置 PROXY_USER/PROXY_PASS 认证。

    # 仅映射到宿主机回环地址，不向公网开放
    ports:
      - "127.0.0.1:40000:40000/tcp"

    environment:
      TZ: Asia/Shanghai
      # WARP+ License（可选）：26 位 License（xxxxxxxx-xxxxxxxx-xxxxxxxx）
      WARP_LICENSE: "${WARP_LICENSE:-}"
      # 代理认证（可选）：两者同时填写才生效（HTTP Basic + SOCKS5 user/pass）
      PROXY_USER: "${PROXY_USER:-}"
      PROXY_PASS: "${PROXY_PASS:-}"
      # 解锁巡检：检测项 ndc / 间隔秒数 / 总开关
      UNLOCK_STREAMS: "${UNLOCK_STREAMS:-ndc}"
      UNLOCK_INTERVAL: "${UNLOCK_INTERVAL:-300}"
      WARP_AUTO_UNLOCK: "${WARP_AUTO_UNLOCK:-1}"
      # 检测未通过时是否轮换出口 IP：1 轮换（默认）/ 0 仅记录日志不动 IP
      WARP_UNLOCK_ROTATE: "${WARP_UNLOCK_ROTATE:-1}"
      # 期望出口地区（验证用）与自定义入口 Endpoint（高级）
      WARP_REGION: "${WARP_REGION:-}"
      WARP_ENDPOINT: "${WARP_ENDPOINT:-}"
      # 隧道协议：proxy 模式仅支持 MASQUE（官方限制，设 WireGuard 会导致连接无限失败重试）；
      # 填其他值只会在启动日志里告警并强制回退 MASQUE
      WARP_PROTOCOL: "${WARP_PROTOCOL:-MASQUE}"
      # 看门狗巡检间隔（秒），失联自动重连
      WARP_WATCHDOG_INTERVAL: "${WARP_WATCHDOG_INTERVAL:-60}"
      # warp-svc 日志级别（error/warn/info/debug/trace），默认 error 基本静默；
      # warn 层全是容器环境噪音，info/debug 仅排障用（量大）
      WARP_LOG_LEVEL: "${WARP_LOG_LEVEL:-error}"
      # warp-svc 日志落盘目录前缀；实际文件按日滚动为 warp-YYYY-MM-DD.log，
      # warp.log 为指向当天文件的软链（tail -F logs/warp.log 可跨天跟踪）；留空 = 不落盘
      WARP_LOG_FILE: "${WARP_LOG_FILE:-/logs/warp.log}"
      # 日志保留天数（按日期文件清理，卷文件一并清理），默认 3 = 今天 + 前 2 天
      WARP_LOG_KEEP_DAYS: "${WARP_LOG_KEEP_DAYS:-3}"
      # 单文件大小上限（MB）：超过则同日分卷（warp-DATE.log → -01，最新始终是 warp-DATE.log）；
      # 0 = 不限制。分卷失败时退化为原地截断（保留最后 2000 行）
      WARP_LOG_MAX_SIZE_MB: "${WARP_LOG_MAX_SIZE_MB:-10}"
      # warp-svc 日志是否同步输出到容器日志：默认 1 = 落盘 + docker logs 双路；
      # 设 0 则仅落盘文件，docker logs 只保留 entrypoint 生命周期日志
      WARP_LOG_STDOUT: "${WARP_LOG_STDOUT:-1}"
      # 追加日志噪音关键字（ERE 正则，| 分隔），叠加在内置白名单之上，可留空
      LOG_NOISE_KEYWORDS: "${LOG_NOISE_KEYWORDS:-}"

    # 注册状态持久化：跨容器重启保留 WARP 账户，避免重复注册
    volumes:
      - ./config:/var/lib/cloudflare-warp
      - ./logs:/logs

    # 资源限制：
    #   内存——warp-svc（MASQUE/QUIC）稳态 ~100-150MB + gost ~30MB，512MB 留 2-3 倍余量；
    #         超限被内核 OOM Kill 后由 restart 策略自动拉起
    #   CPU——代理转发单核足够（QUIC 加解密 + 中转），限 1 核防止异常失控吃满宿主机
    #   pids——warp-svc 以线程为主，256 上限防泄漏
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

    # 容器日志轮转（默认双路输出时存放 warp-svc 过滤后日志；WARP_LOG_STDOUT=0 时仅剩
    # entrypoint 生命周期日志，每小时几行）
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -ksm8 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq "^warp=(on|plus)$"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
