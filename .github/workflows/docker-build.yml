name: Build WARP Unlock Image

on:
  # 手动触发构建（与主分支一致，防止 Fork 仓库滥用 Actions 配额）
  workflow_dispatch:
    inputs:
      image_tag:
        description: '自定义镜像 Tag 后缀 (留空则默认为当天日期如 20261105)'
        required: false
        default: ''
      upx_warp_svc:
        description: 'UPX 压缩 warp-svc (1=开启 ~90MB，0=关闭 ~145MB)'
        required: false
        default: '1'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 动态生成镜像 Tag（输入为空时默认当天日期）
      - name: Generate Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi

      # 2. 设置 QEMU 模拟器以支持多架构构建
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 构建并推送到 DockerHub
      #    v2.0 为 Debian + 官方客户端 MASQUE 架构，Tag 前缀 masque-；
      #    UPX 默认压缩 warp-svc（~90MB），异常时可手动触发选 0 回退
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 仅编译云服务器通用架构
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudflare-warp-unlock:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudflare-warp-unlock:masque-${{ steps.tag.outputs.value }}
          build-args: |
            UPX_WARP_SVC=${{ inputs.upx_warp_svc || '1' }}
          # 开启 GitHub Actions 缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
