name: Build WARP Unlock Image

on:
  # 手动触发构建，防止 Fork 仓库滥用 Actions 配额
  workflow_dispatch:
    inputs:
      image_tag:
        description: '自定义镜像 Tag 后缀 (留空则默认为当天日期如 20261104)'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 动态生成镜像 Tag（解决 steps.tag_date.outputs.value 缺失问题）
      - name: Generate Tag Date
        id: tag_date
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi

      # 2. 设置 QEMU 模拟器以支持多架构构建
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 构建并推送到 DockerHub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 仅编译云服务器通用架构，杜绝不支持的 armv7/ppc64le/s390x
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/warp-unlock:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/warp-unlock:alpine-${{ steps.tag_date.outputs.value }}
          # 开启 GitHub Actions 缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
